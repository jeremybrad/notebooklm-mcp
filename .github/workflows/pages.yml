name: Publish C021 information pages

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Full merged main commit approved for this deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: c021-public-pages
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - name: Require the approved main commit
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, re
          approved = os.environ['APPROVED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', approved) or approved != os.environ['RUN_SHA']:
              raise SystemExit('Refusing deployment: approved_sha must match this main commit')
          PY
      - name: Check out that exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Stage only the two public files
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          source = Path('site')
          names = {'index.html', 'privacy.html'}
          if source.is_symlink() or {p.name for p in source.iterdir()} != names:
              raise SystemExit('Refusing unexpected site contents')
          target = Path(os.environ['RUNNER_TEMP']) / 'c021-public-site'
          target.mkdir()
          for name in sorted(names):
              path = source / name
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Refusing non-regular public file')
              shutil.copyfile(path, target / name)
          PY
      - name: Upload only the public site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/c021-public-site
          retention-days: 1

  deploy:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the approved artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
